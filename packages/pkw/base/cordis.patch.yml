# PKW host-plane patch for a DSH Web profile. Apply AFTER `@deepseek-ai/dsh-base`
# and `@deepseek-ai/dsh-web-app`: they own storage/storage-json/storage-domain
# and workspace. Reuse those host services; inserting them again is invalid.
# A headless host must explicitly supply an equivalent workspaceRegistry plus
# its sessionPersistence/fs dependencies before using this bundle. This patch
# does not bootstrap another registry or choose a new workspace identity.
#
# One harness-managed SQLite DB; structured PKW state is partitioned by
# workspaceId (never a `.system/workspace.sqlite` inside the workspace).
# DSH domains, including workspace and session_projcache, retain the host's
# JSON default. Only the five named PKW domains use SQLite. This is routing,
# not a migration: existing data/registry locations must be verified before
# enabling PKW on an upgraded host.
# A patch replaces a row's WHOLE config. Customized deployments must restate
# their full backend/routes config in the later profile patch.

- insert:
    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('pkw', 'pkw.sqlite')

    - id: pkw-events
      name: '@deepseek-ai/dsh-pkw-events'

    - id: pkw-workspace
      name: '@deepseek-ai/dsh-pkw-workspace'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json
    routes:
      pkw: sqlite
      pkw_notes: sqlite
      pkw_attachments: sqlite
      pkw_tasks: sqlite
      pkw_weknora_sync: sqlite
