# =============================================================================
# config.example.yaml — PKW 配置模板（示例，无真实值）
#
# 用法：cp config.example.yaml config.yaml 并填写；或从环境变量注入。
# 真实值永不进入 git —— kbId / weknoraBaseUrl 是「按部署变化」的值，
# API key 是 secret，只允许以 weknoraApiKeyRef 引用环境变量。
#
# 实际落点是 profile 的 cordis.patch.yml（见 docs/HANDOVER.md §6），
# 本文件是填写模板与配置契约说明，不被运行时直接读取。
# =============================================================================
config:
  # 工作区路径：相对 DSH_HOME，已可移植，通常无需改。
  workspacePath: "${DSH_HOME}/pkw/workspace"

  # WeKnora 知识库 ID（PKW mirror KB）。原为硬编码，改为环境/配置注入。
  kbId: "${PKW_KB_ID}"

  # WeKnora API 地址。原为硬编码 127.0.0.1:18088，改为环境/配置注入。
  weknoraBaseUrl: "${WEKNORA_BASE_URL}"

  # API key：只引用环境变量名，绝不在此落明文。
  weknoraApiKeyRef: WEKNORA_API_KEY

  # ---- 固定调优值（可选覆盖）----
  pollMs: 2000
  retryBaseMs: 5000
  retryMaxMs: 120000
  recoveryGraceAttempts: 3
